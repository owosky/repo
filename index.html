<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fatality's Sileo Repo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f0f12;
      color: #f5f5f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1c1c1e;
      padding: 2rem;
      border-radius: 16px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    h1 { margin-top: 0; font-size: 1.5rem; }
    p { color: #a1a1a6; line-height: 1.5; }
    .btn {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.75rem 1.5rem;
      background: #2cb1be;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Fatality's Repo</h1>
    <p>RootHide (<code>iphoneos-arm64e</code>) &amp; Procursus Sileo Repository featuring <strong>FiveBars</strong>.</p>
    <a id="sileo-btn" class="btn" href="#">Add to Sileo</a>
  </div>
  <script>
    const repoUrl = window.location.origin + window.location.pathname.replace(/\/index\.html$/, '');
    document.getElementById('sileo-btn').href = 'sileo://source/' + repoUrl;
  </script>
</body>
</html>
